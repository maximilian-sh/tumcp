[project]
name = "tumcp"
dynamic = ["version"]
description = "Local, read-only MCP server for TU Wien: TUWEL (Moodle) and TISS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "httpx2>=2.0",
    "pydantic>=2",
    "selectolax>=1.0",
    "filelock>=3.12",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "tzdata; sys_platform == 'win32'",     # Windows has no time zone database for zoneinfo
]

[project.urls]
Repository = "https://github.com/maximilian-sh/tumcp"

[project.scripts]
tumcp = "tumcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tumcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tumcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
